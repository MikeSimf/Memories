<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DnD Memory</title>
  <meta name="description" content="DnD Memory — память вашей кампании.">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 20%, #2a1e3f 0%, #14101c 45%, #0b0910 100%);
      color: #f1eaf7; font-family: "Georgia", "Times New Roman", serif;
      padding: 24px;
    }
    .card { max-width: 640px; text-align: center; }
    .sigil { width: 120px; height: 120px; margin: 0 auto 24px; color: #c9a7ff; opacity: .9; }
    h1 { font-size: clamp(2rem, 7vw, 3.4rem); margin: 0 0 8px; letter-spacing: .04em; }
    .sub { color: #b9a9cc; font-size: 1.05rem; margin: 0 0 28px; }
    .text { color: #d8cce6; line-height: 1.65; font-size: 1.05rem; margin: 0 0 32px; }
    a.btn {
      display: inline-block; padding: 14px 28px; border-radius: 10px;
      background: #7c4dff; color: #fff; text-decoration: none; font-weight: 700;
      box-shadow: 0 8px 30px rgba(124, 77, 255, .35);
    }
    a.btn:hover { background: #9169ff; }
    footer { margin-top: 40px; color: #7d6f90; font-size: .85rem; }
  </style>
</head>
<body>
  <main class="card">
    <svg class="sigil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2.2 21.4 8 18.6 20.4H5.4L2.6 8zM12 2.2v7M21.4 8 12 12.8 2.6 8M18.6 20.4 12 12.8 5.4 20.4M12 9.2 8.2 20.4M12 9.2l3.8 11.2"/>
    </svg>
    <h1>DnD Memory</h1>
    <p class="sub">Память вашей кампании</p>
    <p class="text">
      Здесь скоро появится основной сайт. Пока герои, локации, предметы и истории
      живут в приложении — открывайте его по ссылке ниже.
    </p>
    <a class="btn" href="https://dnd-memory.imikea.ru/">Открыть DnD Memory</a>
    <footer>imikea.ru</footer>
  </main>
</body>
</html>
