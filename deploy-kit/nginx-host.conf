# Nginx на хосте: принимает 80/443 и разводит домены по контейнерам.
# Прод-контейнер слушает 127.0.0.1:8080, тестовый — 127.0.0.1:8081.
# Подключение: /etc/nginx/sites-available/dnd-memory.conf + symlink в sites-enabled.

server {
    listen 80;
    server_name dnd-memory.ivmikea.ru;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }
}

server {
    listen 80;
    server_name test-dnd-memory.ivmikea.ru;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }
}

