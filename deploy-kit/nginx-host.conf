# Nginx на хосте: imikea.ru — заглушка, приложение — на поддоменах.
# Прод-контейнер слушает 127.0.0.1:8080, тестовый — 127.0.0.1:8081.

# Корень домена: только заглушка.
server {
    listen 80;
    server_name imikea.ru www.imikea.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name imikea.ru www.imikea.ru;

    ssl_certificate     /etc/letsencrypt/live/dnd-memory.imikea.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dnd-memory.imikea.ru/privkey.pem;

    root /opt/dnd-memory/stub;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Прод.
server {
    listen 80;
    server_name dnd-memory.imikea.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dnd-memory.imikea.ru;

    ssl_certificate     /etc/letsencrypt/live/dnd-memory.imikea.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dnd-memory.imikea.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }
}

# Тест.
server {
    listen 80;
    server_name test-dnd-memory.imikea.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name test-dnd-memory.imikea.ru;

    ssl_certificate     /etc/letsencrypt/live/dnd-memory.imikea.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dnd-memory.imikea.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }
}
