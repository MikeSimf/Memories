# Настройки рабочего экземпляра. Секреты берутся из окружения (файл .env),
# поэтому пароли в этом файле не хранятся.
server:
  port: 8080

spring:
  datasource:
    # stringtype=unspecified обязателен: без него не работают JSON-колонки
    url: jdbc:postgresql://db:5432/dnd?stringtype=unspecified
    username: dnd
    password: ${DB_PASSWORD}

dnd:
  # Проверка обновлений приложения: эти данные отдаёт GET /api/app/latest
  app:
    latest-version-code: 33
    latest-version-name: 1.0.32
    min-version-code: 4
    apk-url: http://test-dnd-memory.ivmikea.ru/dnd-memory.apk
    notes: Сайты без портов: nginx хоста для двух доменов
