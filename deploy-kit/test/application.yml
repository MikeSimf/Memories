# Настройки рабочего экземпляра. Секреты берутся из окружения (файл .env),
# поэтому пароли в этом файле не хранятся.
server:
  port: 8080

spring:
  datasource:
    # stringtype=unspecified обязателен: без него не работают JSON-колонки
    url: jdbc:postgresql://db:5432/dnd?stringtype=unspecified
    username: dnd
    password: ${DB_PASSWORD}

dnd:
  # Проверка обновлений приложения: эти данные отдаёт GET /api/app/latest
  app:
    latest-version-code: 36
    latest-version-name: 1.0.35
    min-version-code: 4
    apk-url: https://test-dnd-memory.imikea.ru/dnd-memory.apk
    notes: "Заглушка на imikea.ru и закрытый порт 8091"
    versions:
      - version: "1.0.35"
        date: "2026-10-25"
        notes: "Заглушка на imikea.ru и закрытый порт 8091"
      - version: "1.0.34"
        date: "2026-10-25"
        notes: "Домены imikea.ru и HTTPS"
      - version: "1.0.33"
        date: "2026-10-24"
        notes: "HTTPS через имена sslip.io и запасной вход по IP"
      - version: "1.0.32"
        date: "2026-10-24"
        notes: "Сайты без портов: nginx хоста для двух доменов"
      - version: "1.0.31"
        date: "2026-10-24"
        notes: "Домены ivmikea.ru и служебная учётка system"
      - version: "1.0.30"
        date: "2026-10-23"
        notes: "Карточка просмотра материала, история новых версий, системная информация"
      - version: "1.0.29"
        date: "2026-10-23"
        notes: "Ссылки списком, права историй и материалов, ссылка на VK"
      - version: "1.0.28"
        date: "2026-10-23"
        notes: "Карточки без аватара, порядок свайпа, профиль и настройки"
      - version: "1.0.27"
        date: "2026-10-23"
        notes: "Свайп по всем разделам, карточка кампании, истории без почты"
      - version: "1.0.26"
        date: "2026-10-23"
        notes: "Подтверждение почты, сброс пароля письмом, обратная связь"
      - version: "1.0.25"
        date: "2026-10-23"
        notes: "Мастер может править кампанию, удаляет только владелец"
      - version: "1.0.24"
        date: "2026-10-23"
        notes: "Статичное нижнее меню и карточка кампании"
      - version: "1.0.23"
        date: "2026-10-22"
        notes: "Постоянное меню, упоминания списком"
      - version: "1.0.22"
        date: "2026-10-22"
        notes: "Нижняя панель, пол в углу, прежние значки рас"
      - version: "1.0.21"
        date: "2026-10-22"
        notes: "Новые расы, значки классов и история версий"
  mail:
    enabled: ${MAIL_ENABLED:false}
    ssl: ${MAIL_SSL:true}
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:DnD Memory}
  admin-email: ${ADMIN_EMAIL:}
  system-password: ${SYSTEM_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
  public-url: ${PUBLIC_URL}
  cors-origins: ${CORS_ORIGINS}
  files-dir: /var/lib/dnd-memory/files
  admin-token: ${ADMIN_TOKEN:}

logging:
  level:
    ru.dndmemory: ${LOG_LEVEL:INFO}
