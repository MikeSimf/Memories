# Настройки рабочего экземпляра. Секреты берутся из окружения (файл .env),
# поэтому пароли в этом файле не хранятся.
server:
  port: 8080

spring:
  datasource:
    # stringtype=unspecified обязателен: без него не работают JSON-колонки
    url: jdbc:postgresql://db:5432/dnd?stringtype=unspecified
    username: dnd
    password: ${DB_PASSWORD}

