# --- JVM -------------------------------------------------------------------
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# --- Android ---------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Адрес сервера DnD Memory ----------------------------------------------
# Эмулятор Android обращается к хосту через 10.0.2.2. Для реального устройства
# укажите адрес тестового или рабочего контура, например:
#   DND_SERVER_URL=https://dnd.example.com/
# Значение попадает в BuildConfig.DND_SERVER_URL.
DND_SERVER_URL=https://test-dnd-memory.imikea.ru/
