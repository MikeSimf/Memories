plugins {
    id 'com.android.application'
}

// Адрес сервера задаётся в gradle.properties (DND_SERVER_URL) и попадает в BuildConfig.
def dndServerUrl = (project.findProperty('DND_SERVER_URL') ?: 'http://10.0.2.2:8080/').toString()
if (!dndServerUrl.endsWith('/')) {
    dndServerUrl = dndServerUrl + '/'
}

android {
    namespace 'ru.dndmemory'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.dndmemory'
        minSdk 24
        targetSdk 34
        versionCode 17
        versionName "1.0.16"

        buildConfigField 'String', 'DND_SERVER_URL', "\"${dndServerUrl}\""
        buildConfigField 'String', 'DEEP_LINK_SCHEME', "\"dndmemory\""

        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // --- AndroidX core / UI ---
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.browser:browser:1.7.0'

    // --- Material Components ---
    implementation 'com.google.android.material:material:1.11.0'

    // --- Lifecycle (MVVM: ViewModel + LiveData) ---
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.6.2'

    // --- Room (локальная база, офлайн-первый режим) ---
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // --- Retrofit / OkHttp / Gson ---
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // --- WorkManager (фоновая синхронизация) ---
    implementation 'androidx.work:work-runtime:2.9.0'

    // --- DataStore (токены и настройки) ---
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // --- QR: сканирование камерой ---
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
