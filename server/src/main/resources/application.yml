server:
  port: ${DND_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always

spring:
  application:
    name: dnd-memory-server
  datasource:
    # stringtype=unspecified обязателен: jsonb-колонки пишутся из строк без приведения типов
    url: ${DND_DB_URL:jdbc:postgresql://localhost:5432/dnd?stringtype=unspecified}
    username: ${DND_DB_USER:dnd}
    password: ${DND_DB_PASSWORD:dnd}
    hikari:
      maximum-pool-size: ${DND_DB_POOL_SIZE:10}
      pool-name: dnd-pool
  jpa:
    open-in-view: false
    hibernate:
      # Схему полностью ведёт Flyway. Валидация Hibernate отключена осознанно:
      # колонки jsonb маппятся на String (stringtype=unspecified), и валидатор
      # типов давал бы ложные расхождения.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

dnd:
  version: 1.0.0
  public-url: ${DND_PUBLIC_URL:http://localhost:8080}
  files-dir: ${DND_FILES_DIR:/var/lib/dnd-memory/files}
  cors-origins: ${DND_CORS_ORIGINS:http://localhost:5173,http://localhost:8081}
  # Токен админ-панели сброса пароля. Если не задан, GET /api/admin/password-resets отвечает 404
  admin-token: ${DND_ADMIN_TOKEN:}
  # Проверка обновлений приложения (GET /api/app/latest)
  app:
    latest-version-code: ${DND_APP_LATEST_CODE:1}
    latest-version-name: ${DND_APP_LATEST_NAME:1.0.0}
    min-version-code: ${DND_APP_MIN_CODE:1}
    apk-url: ${DND_APP_APK_URL:}
    notes: ${DND_APP_NOTES:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    ssl: ${MAIL_SSL:true}
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:DnD Memory}
  admin-email: ${ADMIN_EMAIL:}
  retention:
    change-log-days: ${DND_CHANGE_LOG_DAYS:90}
    change-log-max-rows: ${DND_CHANGE_LOG_MAX_ROWS:50000}
  jwt:
    # В продакшене ОБЯЗАТЕЛЬНО задать свой секрет (минимум 32 символа)
    secret: ${DND_JWT_SECRET:dnd-memory-dev-secret-change-me-please-32}
    access-token-minutes: ${DND_ACCESS_TOKEN_MINUTES:15}
    # Веб-сессия — месяц
    refresh-token-days: ${DND_REFRESH_TOKEN_DAYS:30}
    # Сессия приложения живёт год: телефон не должен разлогиниваться
    android-refresh-token-days: ${DND_ANDROID_REFRESH_TOKEN_DAYS:365}

logging:
  level:
    root: INFO
    ru.dndmemory: ${DND_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
