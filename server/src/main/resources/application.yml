server:
  port: ${DND_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always

spring:
  application:
    name: dnd-memory-server
  datasource:
    # stringtype=unspecified обязателен: jsonb-колонки пишутся из строк без приведения типов
    url: ${DND_DB_URL:jdbc:postgresql://localhost:5432/dnd?stringtype=unspecified}
    username: ${DND_DB_USER:dnd}
    password: ${DND_DB_PASSWORD:dnd}
    hikari:
      maximum-pool-size: ${DND_DB_POOL_SIZE:10}
      pool-name: dnd-pool
  jpa:
    open-in-view: false
    hibernate:
      # Схему полностью ведёт Flyway. Валидация Hibernate отключена осознанно:
      # колонки jsonb маппятся на String (stringtype=unspecified), и валидатор
      # типов давал бы ложные расхождения.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

dnd:
  version: 1.0.0
  public-url: ${DND_PUBLIC_URL:http://localhost:8080}
  files-dir: ${DND_FILES_DIR:/var/lib/dnd-memory/files}
  cors-origins: ${DND_CORS_ORIGINS:http://localhost:5173,http://localhost:8081}
  retention:
    change-log-days: ${DND_CHANGE_LOG_DAYS:90}
    change-log-max-rows: ${DND_CHANGE_LOG_MAX_ROWS:50000}
  jwt:
    # В продакшене ОБЯЗАТЕЛЬНО задать свой секрет (минимум 32 символа)
    secret: ${DND_JWT_SECRET:dnd-memory-dev-secret-change-me-please-32}
    access-token-minutes: ${DND_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${DND_REFRESH_TOKEN_DAYS:30}
    # Сессия устройства живёт год: телефон не должен разлогиниваться
    device-refresh-token-days: ${DND_DEVICE_REFRESH_TOKEN_DAYS:365}
  oauth:
    yandex:
      client-id: ${DND_YANDEX_CLIENT_ID:}
      client-secret: ${DND_YANDEX_CLIENT_SECRET:}
      authorize-url: https://oauth.yandex.ru/authorize
      token-url: https://oauth.yandex.ru/token
      profile-url: https://login.yandex.ru/info?format=json
    vk:
      client-id: ${DND_VK_CLIENT_ID:}
      client-secret: ${DND_VK_CLIENT_SECRET:}
      authorize-url: https://id.vk.com/authorize
      token-url: https://id.vk.com/oauth2/auth
      profile-url: https://id.vk.com/oauth2/user_info

logging:
  level:
    root: INFO
    ru.dndmemory: ${DND_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
