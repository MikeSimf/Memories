# Настройки для запуска jar без Docker.
#
# Положите этот файл рядом с dnd-memory-server.jar под именем application.yml —
# Spring Boot подхватывает его автоматически, и переменные окружения не нужны.
# Проверено: приложение читает файл и запускается на указанном порту.

server:
  port: 8080

spring:
  datasource:
    # Параметр stringtype=unspecified обязателен: без него не работают JSON-колонки
    url: jdbc:postgresql://localhost:5432/dnd?stringtype=unspecified
    username: dnd
    password: ЗАМЕНИТЕ_НА_ПАРОЛЬ_БАЗЫ

dnd:
  jwt:
    # Обязательно: не короче 32 символов, иначе приложение не стартует.
    # Сгенерировать: openssl rand -base64 48
    secret: ЗАМЕНИТЕ_НА_СЛУЧАЙНУЮ_СТРОКУ_НЕ_КОРОЧЕ_32_СИМВОЛОВ
  # Внешний адрес: попадает в ссылки приглашений и QR-коды
  public-url: http://203.0.113.10:8080
  # Откуда разрешены запросы из браузера (список через запятую)
  cors-origins: http://203.0.113.10:8080
  # Куда складывать загруженные картинки; каталог должен существовать
  files-dir: /var/lib/dnd-memory/files
  # Нужен только для выдачи ссылок сброса пароля: /api/admin/password-resets
  admin-token: ЗАМЕНИТЕ_ИЛИ_УДАЛИТЕ_СТРОКУ
