# Заглушка для запросов, которым не нашлось домена: отдаём 404, но обслуживаем
# проверку Let's Encrypt, чтобы сертификат можно было выпустить до добавления домена.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
