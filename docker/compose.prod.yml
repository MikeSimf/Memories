# Рабочий контур: НЕ публикует порты сам — трафик приходит от общего шлюза
# (docker/ingress) по домену. Запуск: ./scripts/deploy.sh prod
name: dnd-prod

services:
  db:
    image: postgres:15-alpine
    container_name: dnd-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dnd
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в docker/env.prod}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd -d dnd"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: dnd-memory-server:prod
    container_name: dnd-prod-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DND_DB_URL: jdbc:postgresql://db:5432/dnd?stringtype=unspecified
      DND_DB_USER: dnd
      DND_DB_PASSWORD: ${DB_PASSWORD}
      DND_JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET (не короче 32 символов)}
      DND_ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DND_PUBLIC_URL: https://${DOMAIN:?Задайте DOMAIN в docker/env.prod}
      DND_CORS_ORIGINS: ${CORS_ORIGINS:?Задайте CORS_ORIGINS в docker/env.prod}
      DND_FILES_DIR: /var/lib/dnd-memory/files
      DND_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JAVA_TOOL_OPTIONS: -Xmx${SERVER_HEAP_MB:-768}m
    volumes:
      - files:/var/lib/dnd-memory/files
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: dnd-memory-web:prod
    container_name: dnd-prod-web
    restart: unless-stopped
    depends_on:
      - server
    # Необязательный локальный вход. Нужен, когда HTTPS уже отдаёт внешний nginx
    # (например, nginx хостера с сертификатом): он проксирует на 127.0.0.1:${WEB_PORT}.
    # По умолчанию порт слушает только localhost и наружу не выставлен.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:80"
    volumes:
      - ./nginx/nginx.app.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks: [internal, edge]

networks:
  internal:
  edge:
    external: true
    name: edge

volumes:
  db-data:
  files:
